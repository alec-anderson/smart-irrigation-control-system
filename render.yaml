services:
  - type: web
    name: irrigation-monitor-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run_dev.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: irrigation-monitor-db
          property: connectionString
      - key: DEVICE_TOKENS
        sync: false
      - key: DASHBOARD_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: TELEMETRY_RETENTION_DAYS
        value: "14"
      - key: EVENT_RETENTION_DAYS
        value: "30"
      - key: RETENTION_CLEANUP_INTERVAL_SECONDS
        value: "3600"

  - type: web
    name: irrigation-monitor-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: python build_static.py
    staticPublishPath: dist
    envVars:
      - key: DASHBOARD_API_BASE
        sync: false
      - key: DASHBOARD_DEVICE_ID
        value: pi-prototype-001
      - key: DASHBOARD_TOKEN
        sync: false
      - key: DASHBOARD_POLL_SECONDS
        value: "6"

databases:
  - name: irrigation-monitor-db
    plan: free
    databaseName: irrigation
    user: irrigation
